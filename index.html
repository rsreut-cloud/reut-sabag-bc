<title>רעות סבג — כרטיס ביקור</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-deep:#F5F3FA;
    --surface:#FFFFFF;
    --ink:#2E2A3D;
    --ink-soft:#6B6478;
    --ink-faint:#9992A8;
    --accent:#A899EA;
    --accent-deep:#9077DE;
    --accent-soft:#C6BBF2;
    --accent-tint:#F0ECFB;
    --accent-tint-2:#E7E0F9;
    --line:rgba(46,42,61,0.08);
    --shadow-d:rgba(88,79,130,0.28);
    --shadow-d-soft:rgba(88,79,130,0.16);
    --shadow-l:rgba(255,255,255,0.9);
    --radius-xl:32px;
    --radius-l:24px;
    --radius-m:18px;
    --radius-s:14px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{ overflow-x:hidden; }
  body{
    background:var(--paper-deep);
    color:var(--ink);
    font-family:"Rubik", Arial, sans-serif;
    direction:rtl;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:stretch;
    padding:clamp(8px,2.5vw,14px);
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }

  .stage{
    width:100%;
    max-width:480px;
    display:flex;
  }

  .card{
    position:relative;
    width:100%;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    border-radius:var(--radius-xl);
    padding:0 0 28px;
    box-shadow:
      14px 14px 32px var(--shadow-d-soft),
      -10px -10px 26px var(--shadow-l);
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:clamp(26px,7vw,44px) clamp(18px,6vw,26px) 16px;
    text-align:center;
    opacity:0;
    transform:translateY(10px);
    animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .medallion{
    width:136px;
    height:136px;
    margin:0 auto clamp(14px,3.5vw,20px);
    border-radius:50%;
    padding:2px;
    background:var(--paper);
    box-shadow:
      9px 9px 20px var(--shadow-d-soft),
      -7px -7px 18px var(--shadow-l);
  }
  .medallion__inner{
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    background:var(--surface);
    box-shadow:
      inset 2px 2px 5px var(--shadow-d-soft),
      inset -2px -2px 4px var(--shadow-l),
      0 0 0 0.5px rgba(46,42,61,0.035);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .medallion__inner img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .name{
    font-family:"Rubik", Arial, sans-serif;
    font-weight:600;
    font-size:clamp(30px,8vw,40px);
    line-height:1.1;
    letter-spacing:-0.02em;
    color:#433D57;
    margin:0 0 10px;
    text-wrap:balance;
  }

  .role{
    display:inline-block;
    font-size:clamp(17px,4.5vw,21px);
    font-weight:600;
    line-height:1.3;
    color:var(--ink-soft);
    background:var(--paper-deep);
    padding:6px 18px;
    border-radius:999px;
    margin:0 0 14px;
    box-shadow:
      inset 1px 1px 2px var(--shadow-d-soft),
      inset -1px -1px 2px var(--shadow-l);
  }

  .tagline{
    font-size:clamp(14px,3.7vw,16px);
    font-weight:400;
    line-height:1.55;
    color:var(--ink-soft);
    margin:0 auto;
    max-width:34ch;
    text-wrap:balance;
  }

  /* ---------- SIGNATURE ILLUSTRATION ---------- */
  .signature{
    display:flex;
    justify-content:center;
    margin:28px 0 2px;
    opacity:0;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) .34s forwards;
  }
  .signature-wrap{
    width:118px;
    transition:transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .signature-wrap:hover{
    transform:translateY(-5px);
  }
  .signature-wrap img{
    width:100%;
    display:block;
    transform:translateX(9px);
    filter:drop-shadow(0 8px 10px rgba(88,79,130,0.16));
  }

  /* ---------- ACTIONS ---------- */
  .actions{
    flex:1;
    padding:clamp(20px,6vw,34px) clamp(16px,5.5vw,26px) 6px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:18px;
    opacity:0;
    transform:translateY(10px);
    animation:rise .7s cubic-bezier(.2,.8,.2,1) .22s forwards;
  }

  .primary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .primary-btn{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:none;
    cursor:pointer;
    text-decoration:none;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    line-height:1.2;
    text-align:center;
    color:#fff;
    background:linear-gradient(180deg,var(--accent) 0%, var(--accent-deep) 100%);
    padding:18px 6px;
    border-radius:var(--radius-l);
    box-shadow:
      5px 7px 16px rgba(144,119,222,0.38),
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -3px 6px rgba(0,0,0,0.12);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .primary-btn svg{width:22px;height:22px;flex:none;}
  .primary-btn:hover{ transform:translateY(-2px); box-shadow:5px 10px 20px rgba(144,119,222,0.42), inset 0 1px 0 rgba(255,255,255,0.4), inset 0 -3px 6px rgba(0,0,0,0.12);}
  .primary-btn:active{
    transform:translateY(1px) scale(.99);
    box-shadow:
      2px 3px 8px rgba(144,119,222,0.35),
      inset 0 3px 8px rgba(0,0,0,0.22);
  }

  .save-hint{
    text-align:center;
    font-size:12px;
    color:var(--ink-faint);
    margin:2px 0 0;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }

  .tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:12px 6px 10px;
    text-decoration:none;
    color:var(--ink);
    background:var(--paper);
    border-radius:var(--radius-s);
    box-shadow:
      4px 4px 10px var(--shadow-d-soft),
      -4px -4px 9px var(--shadow-l);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .tile:hover{ transform:translateY(-2px); }
  .tile:active{
    transform:translateY(1px) scale(.98);
    box-shadow:
      inset 3px 3px 8px var(--shadow-d-soft),
      inset -3px -3px 7px var(--shadow-l);
  }
  .tile__icon{
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--surface);
    box-shadow:
      inset 2px 2px 5px var(--shadow-d-soft),
      inset -2px -2px 4px var(--shadow-l);
  }
  .tile__icon svg{width:15px;height:15px;color:var(--accent-deep);}
  .tile__label{font-size:12px;font-weight:500;letter-spacing:0.02em;color:var(--ink-soft);}

  a.tile:focus-visible,
  .primary-btn:focus-visible{
    outline:3px solid var(--accent-deep);
    outline-offset:3px;
  }

  .footer{
    text-align:center;
    margin-top:8px;
    font-size:12px;
    font-weight:500;
    letter-spacing:.02em;
    color:var(--ink-faint);
    opacity:0;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) .3s forwards;
  }

  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  @media (prefers-reduced-motion:reduce){
    .hero,.signature,.actions,.footer{ animation:none !important; opacity:1 !important; transform:none !important; }
    .signature-wrap{ transition:none !important; }
    .signature-wrap:hover{ transform:none !important; }
    .primary-btn,.tile{ transition:none !important; }
  }
</style>
